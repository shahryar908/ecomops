name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_OWNER: shahryar371

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'user-service/**'
            product-service:
              - 'product-service/**'
            cart-service:
              - 'cart-service/**'
            order-service:
              - 'order-service/**'
            payment-service:
              - 'payment-service/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    name: ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-manifests:
    name: Bump k8s image tags
    needs: [detect-changes, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set new image tags
        working-directory: ops/k8s
        env:
          SERVICES: ${{ join(fromJSON(needs.detect-changes.outputs.services), ' ') }}
        run: |
          for svc in $SERVICES; do
            kustomize edit set image \
              "${{ env.IMAGE_OWNER }}/${svc}=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${svc}:${{ github.sha }}"
            echo "bumped $svc -> ${{ github.sha }}"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet ops/k8s/kustomization.yml; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git add ops/k8s/kustomization.yml
          git commit -m "ci: bump image tags to ${GITHUB_SHA::7} [skip ci]"
          git push
